name: Proxy Sync

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install requests

      - name: Run sync
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: python sync.py

      - name: Commit PROXY.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PROXY.txt
          git commit -m "update proxies (deduplicated)" || echo "no changes"
          git push
